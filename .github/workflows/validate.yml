name: Validate showroom

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test --test-concurrency=1 server/tests/*.test.js
      - name: Smoke test deployed API
        env:
          API_BASE: https://tldhihhyiphqarijpgcm.supabase.co/functions/v1/realestate-api
        run: |
          set -euo pipefail
          test "$(curl -fsS "$API_BASE/health" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).status')" = "ok"
          test "$(curl -fsS "$API_BASE/public/projects/ocean-mansions" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).project.slug')" = "ocean-mansions"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$API_BASE/admin/me")" = "401"




