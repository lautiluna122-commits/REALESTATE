name: Finalize platform MVP

on:
  push:
    branches: [feat/finalize-platform-mvp]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/finalize-platform-mvp
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply finalization pass
        run: node .github/scripts/finalize-platform-mvp.mjs

      - name: Commit finalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "chore: finalize platform MVP [skip ci]"
            git push origin HEAD:feat/finalize-platform-mvp
          fi

      - name: Build
        run: npm run build

      - name: Local API tests
        run: npm run test:api

      - name: Production Edge Function contract tests
        run: node --test --test-concurrency=1 server/tests/production-api.test.js

      - name: Verify protected production route
        env:
          API_BASE: https://tldhihhyiphqarijpgcm.supabase.co/functions/v1/realestate-api
        run: |
          set -euo pipefail
          test "$(curl -fsS "$API_BASE/health" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).status')" = "ok"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$API_BASE/admin/me")" = "401"

      - name: Check stale branches for safe deletion
        run: |
          set -euo pipefail
          git fetch origin --prune
          candidates=(
            "feature/platform-integration-pass"
            "feature/platform-integration-pass-2"
            "feature/platform-integration-pass-3"
            "feature/platform-integration-pass-4"
            "feature/platform-integration-pass-5"
            "feature/platform-integration-pass-6"
            "feature/platform-integration-pass-7"
            "feature/platform-integration-pass-8"
            "feature/platform-integration-pass-final"
            "feature/platform-integration-pass-live"
            "feature/platform-integration-pass-live-sync"
            "feature/cinematic-showroom-v5"
            "tmp-check"
            "tmp-check-delete-me"
          )
          for branch in "${candidates[@]}"; do
            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "SKIP $branch (not found)"
              continue
            fi
            unique=$(git rev-list --count "origin/main..origin/$branch")
            if [ "$unique" -eq 0 ]; then
              echo "DELETE $branch (no commits unique to branch)"
              git push origin --delete "$branch"
            else
              echo "KEEP $branch ($unique unique commits)"
            fi
          done
