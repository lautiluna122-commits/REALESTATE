name: R2 branch cleanup

on:
  push:
    branches: [feat/r2-branch-audit]

permissions:
  contents: write

jobs:
  delete-safe-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete audited safe branches
        shell: bash
        run: |
          set -euo pipefail
          delete=(
            'feature/platform-integration-pass-2'
            'feature/platform-integration-pass-3'
            'feature/platform-integration-pass-4'
            'feature/platform-integration-pass-5'
            'feature/platform-integration-pass-6'
            'feature/platform-integration-pass-7'
            'feature/platform-integration-pass-8'
            'feature/platform-integration-pass-final'
            'feature/showroom-cinematic-pass'
            'feature/visual-foundation'
            'feature/lead-capture'
            'fix/backend-integrity'
            'fix/blank-screen'
            'integrate/pre-demo'
            'tmp-check-delete-me'
            'feat/finalize-platform-mvp'
            'feat/team-audit-security'
            'feat/team-audit-security-audit'
            'feat/r2-close'
          )
          for branch in "${delete[@]}"; do
            echo "Deleting $branch"
            git push origin --delete "$branch" || true
          done
