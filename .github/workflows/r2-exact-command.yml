name: R2 exact command

on:
  push:
    branches: [feat/r2-branch-audit]

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact requested command
        run: |
          set +e
          echo '=== EXACT REQUESTED COMMAND ==='
          timeout 45s bash -lc 'NODE_ENV=test node --test server/tests/auth.test.js server/tests/leads.test.js server/tests/projectRegistry.test.js server/tests/tenantPersistence.test.js'
          code=$?
          echo "=== exact_exit_code=$code ==="
          exit 0
