name: Apply R2 cleanup

on:
  push:
    branches: [feat/r2-branch-audit]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply requested code cleanup
        shell: python
        run: |
          import json, re
          from pathlib import Path
          package = Path('package.json')
          data = json.loads(package.read_text())
          data['scripts']['test:api'] = 'NODE_ENV=test node --test server/tests/auth.test.js server/tests/leads.test.js server/tests/projectRegistry.test.js server/tests/tenantPersistence.test.js'
          package.write_text(json.dumps(data, indent=2) + '\n')

          p = Path('src/admin/ProjectBuilder.jsx')
          text = p.read_text()
          text, n1 = re.subn(r'\nfunction Team\(.*?\nfunction Leads', '\nfunction Leads', text, count=1, flags=re.S)
          text, n2 = re.subn(r'\nfunction Audit\(.*?\n\nexport default function ProjectBuilder', '\n\nexport default function ProjectBuilder', text, count=1, flags=re.S)
          if n1 != 1 or n2 != 1:
            raise SystemExit(f'Expected Team/Audit removals, got Team={n1}, Audit={n2}')
          p.write_text(text)
      - name: Validate requested commands
        run: |
          npm ci
          echo '=== npm run build ==='
          npm run build
          echo '=== local API tests ==='
          NODE_ENV=test node --test server/tests/auth.test.js server/tests/leads.test.js server/tests/projectRegistry.test.js server/tests/tenantPersistence.test.js
          echo '=== production API tests ==='
          npm run test:production
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/admin/ProjectBuilder.jsx
          git commit -m 'chore: finish round 2 test isolation and dead code cleanup' || exit 0
          git push origin HEAD:feat/r2-branch-audit
