name: R2 branch audit

on:
  push:
    branches: [feat/r2-branch-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit requested remote branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git fetch origin main:main
          branches=(
            'feature/platform-integration-pass' 'feature/platform-integration-pass-2' 'feature/platform-integration-pass-3' 'feature/platform-integration-pass-4' 'feature/platform-integration-pass-5' 'feature/platform-integration-pass-6' 'feature/platform-integration-pass-7' 'feature/platform-integration-pass-8' 'feature/platform-integration-pass-final' 'feature/platform-integration-pass-live' 'feature/platform-integration-pass-live-sync' 'feature/cinematic-showroom-v5' 'feature/showroom-cinematic-pass' 'feature/showroom-experience-v2' 'feature/showroom-visual-overhaul' 'feature/visual-foundation' 'feature/demo-foundation' 'feature/lead-capture' 'feature/platform-finalization' 'feature/project-management-core' 'final-showroom' 'fix/backend-integrity' 'fix/blank-screen' 'integrate/pre-demo' 'ai/autonomous-development' 'chore/final-platform-cleanup' 'docs/project-governance' 'tmp-check' 'tmp-check-delete-me'
          )
          for branch in "${branches[@]}"; do
            echo "===== $branch ====="
            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then echo "MISSING"; continue; fi
            echo "git log main..origin/$branch --oneline"
            git log "main..origin/$branch" --oneline --decorate || true
            echo "-- stat --"
            git diff --stat "main...origin/$branch" || true
            echo
          done
      - name: Run requested local commands
        run: |
          npm ci
          npm run build
          NODE_ENV=test node --test server/tests/auth.test.js server/tests/leads.test.js server/tests/projectRegistry.test.js server/tests/tenantPersistence.test.js
          npm run test:production
